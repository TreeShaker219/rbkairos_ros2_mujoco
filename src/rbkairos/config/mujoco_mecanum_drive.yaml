mujoco_sim_ros2_node:
  ros__parameters:
    model_package: rbkairos
    model_file: 'mujoco/rbkairos.xml'
    physics_plugins:
      - 'mujoco_ros2_control::MujocoRos2ControlPlugin'
      - 'rbkairos::BaseGroundTruthPlugin'
    base_ground_truth:
      body_name: 'summit_xl_2/base_footprint'
      world_frame_id: 'world'
      child_frame_id: 'summit_xl_2/base_footprint'
      odom_frame_id: 'world'
      pose_topic: 'base_ground_truth_pose'
      twist_topic: 'base_ground_truth_twist'
      odom_topic: 'base_ground_truth_odom'
      publish_pose: true
      publish_twist: true
      publish_odom: true
      publish_rate_hz: 100.0
      print_enabled: true
      print_rate_hz: 5.0

controller_manager:
  ros__parameters:
    update_rate: 200

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    mecanum_base_controller:
      type: mecanum_drive_controller/MecanumDriveController

    ur5_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

mecanum_base_controller:
  ros__parameters:
    use_stamped_vel: false
    reference_timeout: 0.5
    front_left_wheel_command_joint_name: left_front_wheel_joint
    rear_left_wheel_command_joint_name: left_back_wheel_joint
    front_right_wheel_command_joint_name: right_front_wheel_joint
    rear_right_wheel_command_joint_name: right_back_wheel_joint
    front_left_wheel_state_joint_name: left_front_wheel_joint
    rear_left_wheel_state_joint_name: left_back_wheel_joint
    front_right_wheel_state_joint_name: right_front_wheel_joint
    rear_right_wheel_state_joint_name: right_back_wheel_joint
    kinematics:
      wheels_radius: 0.127
      sum_of_robot_center_projection_on_X_Y_axis: 0.427  # lx+ly, lx=0.2225, ly=0.2045
      base_frame_offset:
        x: 0.0
        y: 0.0
        theta: 0.0
    base_frame_id: base_link
    odom_frame_id: odom
    enable_odom_tf: true

ur5_joint_trajectory_controller:
  ros__parameters:
    joints:
      - ur5/shoulder_pan_joint
      - ur5/shoulder_lift_joint
      - ur5/elbow_joint
      - ur5/wrist_1_joint
      - ur5/wrist_2_joint
      - ur5/wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: false
